[project]
name = "dotdsh-tooling"
version = "0.1.0"
description = "dotdsh tooling workspace: the dev_apply dev-loop CLI (uv run python -m dev_apply)"
requires-python = ">=3.11"
dependencies = [
    "dev-apply",
]

# Dev tooling for the whole workspace (PEP 735 dependency group). `uv sync`
# installs the `dev` group by default (`--no-dev` opts out), so `uv run ruff`
# works right after a sync — no `uvx` round-trip, no separate tool cache.
[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
# The root is an environment aggregator, not a Python package: uv installs
# only its dependencies (the workspace members below) and never builds the
# root itself, so no build backend and no root package are needed.
package = false

[tool.uv.workspace]
members = [
    "py_src/dev-apply",
]

[tool.uv.sources]
dev-apply = { workspace = true }

# Lint/format config for every member: ruff resolves the nearest
# pyproject.toml with a [tool.ruff] table, starting from each checked file,
# and members deliberately define none of their own.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["py_src/dev-apply/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
