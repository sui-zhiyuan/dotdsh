# dotdsh: `$DSH_HOME/settings.yaml` reference — a one-time manual copy; nothing
# syncs it, and an existing settings.yaml is never overwritten.
# Runtime settings are managed by dsh-settings-file and hot-reload. The values
# below mirror the setup this repository is developed against: uncomment what
# you want, drop what you do not.
# Red line: never commit real credentials/secrets (apiKeyEnv stores only the
# environment variable name, never the key itself).
#
# locale:
#   preference: zh
#
# agent-default-model:
#   provider: deepseek-official
#   model: deepseek-v4-flash
#   reasoningEffort: max
#
# ui-conversation:
#   busyEnter: queue
#
# agent-presets:
#   default: standard
#
# llm-pi-ai:
#   providers:
#     opencode:
#       apiKeyEnv: OPENCODE_API_KEY
#
# permission:
#   defaultPreset: workspace-write
