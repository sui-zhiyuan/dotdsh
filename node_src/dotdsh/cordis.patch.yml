# The dotdsh bundle patch: every row that wires this repository's plugin packages
# (node_src/<id>/) into a dsh profile. dsh composes it as one layer because this
# package declares "dsh": {"bundle": {"patch": "./cordis.patch.yml"}} and appears
# in the profile's dsh.profile.bundles — `dev_apply` links the packages into the
# profile, and dsh adds this bundle to that list by itself.
#
# Row shape: a top-level YAML array of loader patch entries. `insert` adds rows
# (id / name / config); `{id, disabled}` or `{id, config}` overrides a row by id;
# later entries win; `config` replaces the whole row's config. The profile's own
# cordis.patch.yml is applied after this layer, so it can override or disable any
# row below, and it is the only layer that hot-reloads while dsh runs.
- insert:
  # Dual-face plugin: this row mounts the package's node half, while its browser
  # half reaches the Web client through the package's `dsh.client` declaration +
  # `exports["./client"]` (whose `inject` edge names the settings client module,
  # so `configForms` exists before this row composes). The node half declares the
  # `ui-tweaks` settings form: since dsh 0.2.0-rc.2 a plugin does not register a
  # namespace — the row's own `Config` schema IS the form, exposed because every
  # field is marked `.volatile()`, and the settings domain keys it by this row's
  # `id`. A browser half cannot read the row's `config`, so that form is the one
  # channel the tweak set's switches travel. The layers are: the schema defaults,
  # then this row's `config` (the bundle layer an override here would sit in),
  # then the user layer the Settings page writes into the profile's own patch:
  #   - id: ui-tweaks
  #     config:
  #       composerEnterNewline: true    # bare Enter breaks the line, Ctrl/Cmd+Enter sends
  #       statusWording: true           # random DeepSeek meme in the running-turn status line
  #       statusPhrases: ["自定义一句"]   # extra phrasing appended to the shipped bank
  # Every switch is read by the PAGE: the browser half keeps its own copy of the
  # defaults and adopts a committed section through the settings transport, so an
  # edit takes effect on the next page load rather than at the next dsh start.
  # A composition with no settings domain hands the plugin references that answer
  # the schema defaults, so the browser half keeps its own defaults too.
  - id: ui-tweaks
    name: '@dsh-external/dotdsh-ui-tweaks'
  # One node-half package carrying the whole feature-branch workflow: the
  # `/git-start`, `/git-complete` and `/git-cleanup` commands with their
  # `git_start`, `git_complete` and `git_cleanup` tools, the bundled `git-flow` and
  # `git-master` skills, and the pre-write guard on the harness's
  # `tools/pre-execute` waterfall. Inside a Team it is Lead-only: a teammate's
  # call is refused before any git runs, and told to ask the Lead.
  #
  # Configuration is optional: every key has a default, and the plugin validates what
  # it is given when it mounts — a `branchPrefix` git would refuse, or a
  # `worktreeRoot` that escapes the repository, fails this row rather than the first
  # operation that trips over it. The keys are `branchPrefix` (`feat/`),
  # `integrationBranch` (`master`), `worktreeRoot` (`.dsh.local/worktrees`),
  # `claimFile` (`.dsh.local/git-flow.toml`), `lockStaleSeconds` (10),
  # `sweepAgeHours` (24), `branchSubjectMaxLength` (20) and `guard` (`on`, or `off`
  # to turn the pre-write guard into a pass-through), and a deployment in another
  # repository overrides them here or in its own profile layer. See the README.
  - id: git-flow
    name: '@dsh-external/dotdsh-git-flow'
  # Lazy ssh: one `ssh_run` tool for remote commands, and one multiplexed ssh
  # connection per server kept open until it has been idle long enough to be worth
  # closing — so a sequence of calls to the same host pays the TCP handshake and
  # the key exchange once. Authentication stays entirely in `~/.ssh`: this plugin
  # reads, writes and passes no credential, and `batchMode` (on by default) makes a
  # host whose key is not already trusted fail with ssh's own message rather than
  # wait on a prompt nothing can answer.
  #
  # Every key has a default: `idleTimeoutMs` (300000), `commandTimeoutMs`
  # (120000), `connectTimeoutSec` (10), `maxOutputBytes` (1048576), `batchMode`
  # (true), `sshBinary` (`ssh`), `sshOptions` ([]) and `controlDir`
  # (`$TMPDIR/dsh-lazy-ssh-<uid>`, created 0700). A value that cannot work fails
  # this row while it mounts.
  #
  # The one boundary worth knowing: a `SIGKILL` of dsh runs no teardown at all, so
  # an abandoned idle master lives at most `idleTimeoutMs` plus 30s, and a call in
  # flight keeps its connection until that command ends. `platform/ssh.ts` explains
  # why, and what a keeper process that would close the window costs.
  #
  # The `controlDir` default is one per user, so two dsh processes running as the
  # same user share a master — and releasing it ends every session on it. Run one
  # such process per machine, or give the second its own `controlDir`.
  - id: lazy-ssh
    name: '@dsh-external/dotdsh-lazy-ssh'
  # Copilot sign-in: dsh 0.2.0-rc.2 ships the authorization *flow* for a GitHub
  # Copilot subscription but no surface that starts it. The stock
  # `@deepseek-ai/dsh-llm-pi-ai` adapter serves the `github-copilot` route for any
  # `llm-pi-ai:` provider profile in $DSH_HOME/settings.yaml, reads the sign-in out
  # of the credential record `llm-pi-ai/github-copilot`, and — unconditionally at
  # mount — registers the flow that obtains that record in `ctx.authorization`,
  # committing it through the credential seam during the attempt. What no shipped
  # surface does is call `ctx.authorization.begin(...)`: the web Models page edits
  # API keys, and no Web/CLI client starts an OAuth flow. This row is that caller,
  # and nothing else.
  #
  # Three slash commands, typed by a human and executed without the model:
  #   /copilot-login   start dsh's flow through `ctx.authorization.begin({key:
  #                    llm-pi-ai/github-copilot, method: "oauth", …})`, answer
  #                    with the verification URL and the code it reports, and
  #                    leave the record to the flow (this package never writes
  #                    it). Run it again (or /copilot-status) to confirm.
  #   /copilot-status  report the stored record, its expiry, the account's model
  #                    list, whether the route is registered, and whether dsh has
  #                    a flow for the record at all
  #   /copilot-logout  remove the stored record (local only)
  # The terminal `dotdsh-copilot-auth` bin reports and removes a stored record
  # through dsh's own credential provider, so the document format, the 0600 mode,
  # the atomic replace and the cross-process writer lock are dsh's, not this
  # package's. Its `login` subcommand only points at `/copilot-login`, because the
  # flow exists only inside a booted harness.
  #
  # What this row deliberately does NOT do: register the provider route (a
  # second adapter for `github-copilot` would collide with the stock one),
  # register any tool (a model must never be able to start an authorization or
  # drop a record), or write the profile's settings. So the route still has to be
  # declared once — `llm-pi-ai: {providers: {github-copilot: {}}}` in
  # settings.yaml, or the provider row on the Models page — and until it is,
  # `/copilot-status` says exactly that instead of leaving a signed-in user
  # wondering why no model appeared.
  #
  # A stored record is validated before it is used: only the official `proxy-ep`
  # endpoint is accepted, and a payload carrying an `enterpriseUrl` is refused
  # outright, because pi-ai builds the refresh endpoint from that field while
  # sending the refresh token to it. The interaction this row supplies answers
  # pi-ai's GitHub Enterprise prompt with the empty string, so every sign-in stays
  # on github.com; GitHub Enterprise sign-in is therefore not supported by design.
  # `loginWindowMs` (180000) is the only configuration key.
  #
  # Not mounted: the three commands above are rarely used, and once a record has
  # been signed in the subscription needs nothing more from this plugin — the
  # stock `llm-pi-ai` adapter reads the record `llm-pi-ai/github-copilot` and
  # refreshes it through the credential seam itself. The package stays a
  # dependency of this bundle, so the terminal half still works:
  # `dotdsh-copilot-auth status|logout`. Uncomment the two rows below to bring
  # `/copilot-login`, `/copilot-status` and `/copilot-logout` back.
  # - id: copilot-auth
  #   name: '@dsh-external/dotdsh-copilot-auth'
