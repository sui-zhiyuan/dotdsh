# The dotdsh bundle patch: every row that wires this repository's plugin packages
# (node_src/<id>/) into a dsh profile. dsh composes it as one layer because this
# package declares "dsh": {"bundle": {"patch": "./cordis.patch.yml"}} and appears
# in the profile's dsh.profile.bundles — `dev_apply` links the packages into the
# profile, and dsh adds this bundle to that list by itself.
#
# Row shape: a top-level YAML array of loader patch entries. `insert` adds rows
# (id / name / config); `{id, disabled}` or `{id, config}` overrides a row by id;
# later entries win; `config` replaces the whole row's config. The profile's own
# cordis.patch.yml is applied after this layer, so it can override or disable any
# row below, and it is the only layer that hot-reloads while dsh runs.
- insert:
  - id: hello-world
    name: '@dsh-external/dotdsh-hello-world'
    config:
      greeting: Hello from dotdsh
  # Dual-face plugin: this row mounts the package's node half, while its browser
  # half reaches the Web client through the package's `dsh.client` declaration +
  # `exports["./client"]`. The node half registers the `ui-tweaks` settings
  # namespace — a browser half cannot read this row's `config`, so that namespace
  # is the one channel the tweak set's switches travel: this row's config (when
  # there is one) becomes the composition base layer, and $DSH_HOME/settings.yaml
  # overrides it per machine, live:
  #   ui-tweaks:
  #     composerEnterNewline: true    # bare Enter breaks the line, Ctrl/Cmd+Enter sends
  #     statusWording: true           # random DeepSeek meme in the running-turn status line
  #     statusPhrases: ["自定义一句"]   # extra phrasing appended to the shipped bank
  # Without a settings provider the browser half runs on the same schema defaults.
  # Disable the whole tweak set per profile with
  # `- {id: ui-tweaks, disabled: true}` in that profile's own patch layer.
  - id: ui-tweaks
    name: '@dsh-external/dotdsh-ui-tweaks'
  # One node-half package carrying the whole feature-branch workflow: the
  # `/git-start` and `/git-complete` commands, the system-prompt contract and its
  # live state context, the bundled `git-commit` skill, and the pre-write guard on
  # the harness's `tools/pre-execute` waterfall.
  #
  # The config below is every tunable, shown at its default. `config` replaces the
  # row's whole config (there is no deep merge), so a profile override must restate
  # every key it wants to keep — or set only what it changes and accept the schema
  # defaults for the rest.
  #
  #   branchPrefix: feature/          # prefix /git-start gives every branch it opens
  #   integrationBranch: ""           # empty = detect origin/HEAD, then main, then master
  #   worktreeRoot: .dsh/worktrees    # relative to the repository's main tree; ignored
  #                                   #   before a worktree is created, with a comment
  #   useWorktreeWhenBusy: true       # a session arriving while others are live is isolated
  #   commitUncommittedBeforeMerge: true   # collect loose work before a merge, rather than block
  #   mergeMessage: Merge {branch} into {integration}
  #   guard: auto-start               # auto-start | block | off — what a write on the
  #                                   #   integration branch does
  #   guardBash: false                # Bash is opt-in: its arguments name a command,
  #                                   #   not a path, so enabling it opens a branch for
  #                                   #   every shell command, including read-only ones
  #
  # `guard: auto-start` only starts a branch when this session is the only live one in
  # the repository; with other sessions present it denies and asks for an explicit
  # `/git-start`, so a subagent can never be silently moved to a different checkout
  # from the parent that dispatched it.
  - id: git-flow
    name: '@dsh-external/dotdsh-git-flow'
    config:
      branchPrefix: feature/
      integrationBranch: ''
      worktreeRoot: .dsh/worktrees
      useWorktreeWhenBusy: true
      commitUncommittedBeforeMerge: true
      mergeMessage: Merge {branch} into {integration}
      guard: auto-start
      guardBash: false
