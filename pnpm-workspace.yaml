# pnpm workspace: one package per directory under node_src/ — the plugin
# packages, plus the @dsh-external/dotdsh bundle whose cordis.patch.yml carries
# the rows that mount them. `dev_apply` link-installs every package here into a
# dsh profile, and `pnpm -r build` compiles the TypeScript ones (the bundle has
# no build script).
packages:
  - node_src/*
