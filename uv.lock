version = 1
revision = 3
requires-python = ">=3.11"

[manifest]
members = [
    "dotdsh-dev",
    "dotdsh-tooling",
]

[[package]]
name = "dotdsh-dev"
version = "0.1.0"
source = { editable = "py_src/dotdsh-dev" }

[[package]]
name = "dotdsh-tooling"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "dotdsh-dev" },
]

[package.metadata]
requires-dist = [{ name = "dotdsh-dev", editable = "py_src/dotdsh-dev" }]
